<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="text">
    <h1>Welcome to the Register Page</h1>
    <p>Please enter your details to create an account for the CricTurf booking system.</p>
    </div>
</body>

<body class="login-page">
    <div id="register">
        <h2>Register</h2>
        
            <label for="username"> Create Username:</label>
            <input type="text" id="username" name="username" placeholder="enter your name"><br><br>
            <label for="password"> Create Password:</label>
            <input type="password" id="password" name="password" placeholder="enter your password" required><br><br>
            <label for="email"> Email:</label>
            <input type="email" id="email" name="email" placeholder="enter your email" required><br><br>
            <label for="Mobile"> Mobile Number:</label>
            <input type="text" id="Mobile" name="Mobile" placeholder="enter your mobile number" required><br><br>
            <div id="button"><a href="index.html">Register</a></div>
    </div>
</body>
</html>
