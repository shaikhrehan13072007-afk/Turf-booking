<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="text">
    <h1>Welcome to the CricTurf</h1>
    <p>Please enter your credentials to access the booking system.</p>
    </div>
    
    <div id="message">
    <h2>login</h2>
    <form>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="enter username" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="enter password" required><br><br>
        <button type="button" onclick="gonext()">Login</button>
        <script>
            function gonext(){ 
                if (document.getElementById("username").value === "" || document.getElementById("password").value === "") {
                    alert("Please fill in all fields.");
                } 
                if (document.getElementById("username").value === "admin" && document.getElementById("password").value === "admin123") {
                    window.location.href = "dashboard.html";
                } else {
                    alert("Invalid username or password.");
                }
            }
        </script>

        <p>or</p>
        <button id="button"><a href="register.html" style="color: white;">Create an account</a></button>
        
    </form>
    </div>

</body>
</html>
